<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow/border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
  
  <!-- Center Icon: Video Play + Hindi Transcript Text / Sparkle -->
  <g filter="url(#shadow)" transform="translate(100, 100) scale(0.61)">
    <!-- Main Sparkle / Diamond Star -->
    <path d="M256 32 C256 150 150 256 32 256 C150 256 256 362 256 480 C256 362 362 256 480 256 C362 256 256 150 256 32 Z" fill="url(#sparkleGrad)"/>
    
    <!-- Video Play triangle in center -->
    <polygon points="230,200 320,256 230,312" fill="#be123c"/>
  </g>
  
  <!-- Text Label Badge -->
  <rect x="126" y="380" width="260" height="60" rx="30" fill="#0f172a" fill-opacity="0.75" />
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">VIBESCRIPT</text>
</svg>
